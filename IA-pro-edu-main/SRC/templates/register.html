<h2>Registro</h2>

<form method="POST" action="{{ url_for('main.register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="sr-only" for="register-username">Username</label>
    <input type="text" id="register-username" name="username" placeholder="Username" required>
    <label class="sr-only" for="register-email">Email</label>
    <input type="email" id="register-email" name="email" placeholder="Email" required>
    <label class="sr-only" for="register-password">Password</label>
    <input type="password" id="register-password" name="password" placeholder="Password" required>
    <button type="submit">Registrarse</button>
</form>

<a href="{{ url_for('main.inicio') }}">Volver</a>
